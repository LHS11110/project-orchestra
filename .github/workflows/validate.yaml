name: Validate Orchestra
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[load]'
      - run: python -m unittest discover -s tests -v
      - run: |
          bash -n scripts/run-load.sh
          bash -n scripts/start-dev.sh
          bash -n scripts/start-deploy.sh
          sh -n scripts/container-entrypoint.sh
      - run: python tests/docker_lab.py
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker build -t project-orchestra:local .
      - run: python tests/container_load_lab.py
