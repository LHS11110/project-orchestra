server {
    server_tokens off;
    listen 443 ssl;
    server_name frelog.p-e.kr;
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/frelog.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frelog.p-e.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:FrelogSSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/api/canvases/[1-9][0-9]*/runtime/(?:build|java/dependencies|execute/stream)$ {
        proxy_read_timeout 240s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_pass https://127.0.0.1:8444;
        proxy_ssl_trusted_certificate /home/steam/.local/share/project-agora/tls-20261013/root-ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name agora-nginx;
        proxy_ssl_protocols TLSv1.3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
    }

    location /api/ {
        proxy_pass https://127.0.0.1:8444;
        proxy_ssl_trusted_certificate /home/steam/.local/share/project-agora/tls-20261013/root-ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name agora-nginx;
        proxy_ssl_protocols TLSv1.3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
    }

    location ~ ^/wss/port/(?<rtc_cpp_ws_port>80(?:0[2-9]|[1-9][0-9]))/rtc/canvas/(?<rtc_canvas_id>[0-9]+)$ {
        proxy_pass https://127.0.0.1:8444;
        proxy_ssl_trusted_certificate /home/steam/.local/share/project-agora/tls-20261013/root-ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name agora-nginx;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ ^/wss/port/(?<cpp_ws_port>80(?:0[2-9]|[1-9][0-9]))/canvas/(?<canvas_id>[0-9]+)$ {
        proxy_pass https://127.0.0.1:8444;
        proxy_ssl_trusted_certificate /home/steam/.local/share/project-agora/tls-20261013/root-ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name agora-nginx;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass https://127.0.0.1:8444;
        proxy_ssl_trusted_certificate /home/steam/.local/share/project-agora/tls-20261013/root-ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name agora-nginx;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
    }
}
