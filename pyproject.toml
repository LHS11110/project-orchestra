[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-orchestra"
version = "0.1.0"
description = "Agora infrastructure documentation, bounded Docker chaos and Locust workloads"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
load = ["locust==2.46.7", "websocket-client==1.9.2", "pyodbc==5.3.0"]

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.setuptools.packages.find]
include = ["orchestra*"]
